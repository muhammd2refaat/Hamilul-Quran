name: CodeQL

# Static security analysis (SQL injection, XSS, path traversal, etc.).
#
# Deliberately NOT triggered on pull_request: in a public repo, PR results
# surface as public check annotations on the diff. On push/schedule the
# findings go only to the repository's Security tab, which is restricted to
# people with write/admin access.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 0"   # Sundays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
