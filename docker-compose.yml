# ─── docker-compose.yml ───────────────────────────────────────────────────────
# Hamilul-Quran — Staging Environment
#
# Services:
#   traefik   — Edge reverse proxy  (ports 80, 443, 8080-dashboard)
#   postgres  — PostgreSQL 16       (internal only)
#   redis     — Redis 7             (internal only)
#   backend   — FastAPI / Uvicorn   → api.kemetekai.com
#   admin     — Vite SPA / serve    → admin.kemetekai.com
#   frontend  — Next.js standalone  → kemetekai.com
#
# Usage:
#   cp .env.staging.example .env.staging
#   # fill in real values in .env.staging
#   docker compose --env-file .env.staging up --build -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── Traefik ────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    container_name: hamilul-traefik
    restart: unless-stopped
    ports:
      - "80:80"        # HTTP
      - "443:443"      # HTTPS (for future SSL)
      - "8080:8080"    # Traefik dashboard (restrict to VPN/firewall in prod)
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Uncomment for Let's Encrypt cert persistence:
      # - traefik_certs:/letsencrypt
    networks:
      - hamilul-net
    labels:
      - "traefik.enable=true"

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hamilul-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hamilul-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hamilul-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - hamilul-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./Back-end
      dockerfile: Dockerfile
    container_name: hamilul-backend
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      # Override localhost references so the app talks to Docker service names
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hamilul-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.kemetekai.com`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Admin CMS (Vite SPA via `serve`) ───────────────────────────────────────
  admin:
    build:
      context: ./Admin-CMS
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_ORIGIN: ${VITE_API_ORIGIN}
        VITE_API_TIMEOUT: "30000"
        VITE_SESSION_TIMEOUT: "1800000"
        VITE_ENABLE_LOGGING: "false"
        VITE_ENABLE_2FA: "true"
    container_name: hamilul-admin
    restart: unless-stopped
    networks:
      - hamilul-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.kemetekai.com`)"
      - "traefik.http.routers.admin.entrypoints=web"
      - "traefik.http.services.admin.loadbalancer.server.port=4173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4173/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Frontend (Next.js standalone) ──────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: hamilul-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    networks:
      - hamilul-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`kemetekai.com`) || Host(`www.kemetekai.com`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# ─── Networks ────────────────────────────────────────────────────────────────
networks:
  hamilul-net:
    driver: bridge

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  # traefik_certs:   # Uncomment when enabling Let's Encrypt
  #   driver: local
