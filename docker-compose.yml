# ─── docker-compose.yml ───────────────────────────────────────────────────────
# Hamilul-Quran — Staging/Production Environment
#
# Services:
#   traefik   — Edge reverse proxy  (ports 80, 443, 8080-dashboard)
#   postgres  — PostgreSQL 16       (internal only)
#   redis     — Redis 7             (internal only)
#   backend   — FastAPI / Uvicorn   → api.elhafazah-academy.com
#   admin     — Vite SPA / serve    → admin.elhafazah-academy.com
#   frontend  — Next.js standalone  → elhafazah-academy.com
#
# Usage:
#   cp .env.staging.example .env.staging
#   # fill in real values in .env.staging
#   docker compose --env-file .env.staging up --build -d
# ─────────────────────────────────────────────────────────────────────────────

# Shared log rotation — without this, container logs grow unbounded on disk
# for as long as the service runs. Applied per-service below via YAML anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ─── Traefik ────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.6
    container_name: hamilul-traefik
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    ports:
      - "80:80"        # HTTP (redirects to HTTPS)
      - "443:443"      # HTTPS (Let's Encrypt)
      # Dashboard port intentionally NOT published — api.insecure is false in
      # traefik.yml. If the dashboard is ever needed, route it via a Host()
      # router behind BasicAuth + TLS instead of publishing :8080.
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - hamilul-net
    labels:
      - "traefik.enable=true"

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hamilul-postgres
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bound to loopback only — reachable solely via an SSH tunnel into this
    # host, never from the public internet. Host port is 5433, not 5432:
    # this box also runs an unrelated host-level (non-Docker) Postgres
    # already listening on 127.0.0.1:5432 for some other project — do not
    # reuse that port. Do not change the host side of this mapping to
    # anything on 0.0.0.0 — that would expose the raw database to the
    # internet.
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - hamilul-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── PostgreSQL backups ─────────────────────────────────────────────────────
  # Periodic pg_dump to a named volume — see db/backup.sh. Same postgres image
  # as the DB itself so pg_dump/pg_restore are always version-matched.
  pg-backup:
    image: postgres:16-alpine
    container_name: hamilul-pg-backup
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: "14"
      BACKUP_INTERVAL_SECONDS: "86400"
    entrypoint: ["sh", "/backup/backup.sh"]
    volumes:
      - ./db:/backup:ro
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hamilul-net

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hamilul-redis
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - hamilul-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./Back-end
      dockerfile: Dockerfile
    container_name: hamilul-backend
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.5
    logging: *default-logging
    env_file:
      - .env.staging
    environment:
      # Override localhost references so the app talks to Docker service names
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hamilul-net
    labels:
      - "traefik.enable=true"
      # HTTP router (auto-redirected to HTTPS by entrypoint rule)
      - "traefik.http.routers.backend.rule=Host(`api.elhafazah-academy.com`)"
      - "traefik.http.routers.backend.entrypoints=web"
      # HTTPS router
      - "traefik.http.routers.backend-secure.rule=Host(`api.elhafazah-academy.com`)"
      - "traefik.http.routers.backend-secure.entrypoints=websecure"
      - "traefik.http.routers.backend-secure.tls=true"
      - "traefik.http.routers.backend-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Admin CMS (Vite SPA via `serve`) ───────────────────────────────────────
  admin:
    build:
      context: ./Admin-CMS
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_ORIGIN: ${VITE_API_ORIGIN}
        VITE_API_TIMEOUT: "30000"
        VITE_SESSION_TIMEOUT: "1800000"
        VITE_ENABLE_LOGGING: "false"
        VITE_ENABLE_2FA: "true"
    container_name: hamilul-admin
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    networks:
      - hamilul-net
    labels:
      - "traefik.enable=true"
      # HTTP router (auto-redirected to HTTPS by entrypoint rule)
      - "traefik.http.routers.admin.rule=Host(`admin.elhafazah-academy.com`)"
      - "traefik.http.routers.admin.entrypoints=web"
      # HTTPS router
      - "traefik.http.routers.admin-secure.rule=Host(`admin.elhafazah-academy.com`)"
      - "traefik.http.routers.admin-secure.entrypoints=websecure"
      - "traefik.http.routers.admin-secure.tls=true"
      - "traefik.http.routers.admin-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin.loadbalancer.server.port=4173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4173/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Frontend (Next.js standalone) ──────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: hamilul-frontend
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    networks:
      - hamilul-net
    labels:
      - "traefik.enable=true"
      # www → apex redirect. Both hosts used to serve identical 200 content
      # at two different URLs with no canonical redirect — a real
      # duplicate-content SEO issue (splits ranking signal between the two).
      # Only fires when Host is the www variant; apex requests pass through
      # unmodified.
      - "traefik.http.middlewares.frontend-www-redirect.redirectregex.regex=^https://www\\.elhafazah-academy\\.com/(.*)"
      - "traefik.http.middlewares.frontend-www-redirect.redirectregex.replacement=https://elhafazah-academy.com/$${1}"
      - "traefik.http.middlewares.frontend-www-redirect.redirectregex.permanent=true"
      # HTTP router (auto-redirected to HTTPS by entrypoint rule)
      - "traefik.http.routers.frontend.rule=Host(`elhafazah-academy.com`) || Host(`www.elhafazah-academy.com`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      # HTTPS router
      - "traefik.http.routers.frontend-secure.rule=Host(`elhafazah-academy.com`) || Host(`www.elhafazah-academy.com`)"
      - "traefik.http.routers.frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.frontend-secure.tls=true"
      - "traefik.http.routers.frontend-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-secure.middlewares=frontend-www-redirect"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# ─── Networks ────────────────────────────────────────────────────────────────
networks:
  hamilul-net:
    driver: bridge

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  traefik_certs:
    driver: local
